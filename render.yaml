# ==============================================================================
# Render Blueprint (Infrastructure as Code)
# Despliegue automatizado de API REST y Base de Datos PostgreSQL en Render
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Servicio Web (API REST en Node.js + Express 5 + TypeScript)
  # ----------------------------------------------------------------------------
  - type: web
    name: task-manager-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && node dist/persistence/init-db.js
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 10

# ------------------------------------------------------------------------------
# Base de Datos PostgreSQL Gestionada
# ------------------------------------------------------------------------------
databases:
  - name: task-manager-db
    databaseName: tasks_db
    user: tasks_user
    plan: free
    region: oregon
